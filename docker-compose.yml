services:
  ezclaude:
    container_name: ezclaude-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Vite dev server (SPA)
      - "5173:5173"
      # Hono API server
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    restart: unless-stopped
